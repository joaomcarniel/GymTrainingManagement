<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gyms')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('gyms')}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gyms</h1>
        <a class="btn btn-primary" th:href="@{/gyms/new}">Add New Gym</a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Phone</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gym : ${gyms}">
            <td th:text="${gym.id}"></td>
            <td th:text="${gym.name}"></td>
            <td th:text="${gym.address?.fullAddress}"></td>
            <td th:text="${#strings.isEmpty(gym.phone) ? '-' : gym.phone}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/gyms/{id}/edit(id=${gym.id})}">Edit</a>
                <form th:action="@{/gyms/{id}/delete(id=${gym.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Delete this gym?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(gyms)}">
            <td colspan="5" class="text-center text-muted">No gyms found. Add your first gym.</td>
        </tr>
        </tbody>
    </table>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
