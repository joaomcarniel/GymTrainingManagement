<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Equipment')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('equipments')}"></nav>

<main class="container" style="max-width: 640px;">
    <h1 class="h3 mb-4">Create Equipment</h1>

    <form th:action="@{/equipments}" th:object="${equipmentForm}" method="post"
          enctype="multipart/form-data">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input id="name" type="text" class="form-control" th:field="*{name}"
                   th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="muscleGroup" class="form-label">Muscle Group</label>
            <select id="muscleGroup" class="form-select" th:field="*{muscleGroup}"
                    th:errorclass="is-invalid">
                <option value="">Select Muscle Group</option>
                <option th:each="group : ${muscleGroups}"
                        th:value="${group.name()}"
                        th:text="${group.label}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{muscleGroup}"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" rows="3" class="form-control" th:field="*{description}"
                      th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            <input id="image" type="file" name="image" class="form-control"
                   accept="image/png,image/jpeg,image/webp"
                   th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{image}"></div>
            <div class="form-text">JPG, PNG or WEBP, up to 5 MB.</div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-link" th:href="@{/equipments}">Back to Equipment</a>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
