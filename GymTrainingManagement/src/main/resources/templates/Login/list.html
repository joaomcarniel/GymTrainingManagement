<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logins</title>
</head>
<body>
<h1>Logins</h1>
<p><a th:href="@{/logins/new}">Add New Login</a></p>
<table border="1">
    <thead>
    <tr><th>ID</th><th>UserName</th><th>RoleId</th><th>IsActive</th></tr>
    </thead>
    <tbody>
    <tr th:each="login : ${logins}">
        <td th:text="${login.getId()}"></td>
        <td th:text="${login.getUserName()}"></td>
        <td th:text="${login.role != null ? login.role.description : 'Not assigned'}"></td>
        <td th:text="${login.isActive()}"></td>
        <td>
            <a th:href="@{/logins/{id}/edit(id=${login.id})}">Edit</a>
            <form th:action="@{/logins/{id}/delete(id=${login.id})}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(logins)}">
        <td colspan="5">No logins found. Add your first login.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
