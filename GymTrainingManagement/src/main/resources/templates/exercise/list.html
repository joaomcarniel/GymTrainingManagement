<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Exercises')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('exercises')}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Exercises</h1>
        <a class="btn btn-primary" th:href="@{/exercises/new}">Add New Exercise</a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Muscle Group</th>
            <th>Equipment</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="exercise : ${exercises}">
            <td th:text="${exercise.name}"></td>
            <td th:text="${exercise.muscleGroup.label}"></td>
            <td th:text="${exercise.equipment != null ? exercise.equipment.name : 'Bodyweight / none'}"></td>
            <td th:text="${#strings.isEmpty(exercise.description) ? '-' : #strings.abbreviate(exercise.description, 80)}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/exercises/{id}/edit(id=${exercise.id})}">Edit</a>
                <form th:action="@{/exercises/{id}/delete(id=${exercise.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Delete this exercise?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(exercises)}">
            <td colspan="5" class="text-center text-muted">No exercises found. Add your first exercise.</td>
        </tr>
        </tbody>
    </table>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
