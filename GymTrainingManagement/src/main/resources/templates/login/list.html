<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logins')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('logins')}"></nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Logins</h1>
        <a class="btn btn-primary" th:href="@{/logins/new}">Add New Login</a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>User Name</th>
            <th>Role</th>
            <th>Is Active</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="login : ${logins}">
            <td th:text="${login.getId()}"></td>
            <td th:text="${login.getUserName()}"></td>
            <td th:text="${login.role != null ? login.role.description : 'Not assigned'}"></td>
            <td>
                <span class="badge"
                      th:classappend="${login.isActive()} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${login.isActive()} ? 'Yes' : 'No'"></span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/logins/{id}/edit(id=${login.id})}">Edit</a>
                <form th:action="@{/logins/{id}/delete(id=${login.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('Delete this login?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(logins)}">
            <td colspan="5" class="text-center text-muted">No logins found. Add your first login.</td>
        </tr>
        </tbody>
    </table>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
