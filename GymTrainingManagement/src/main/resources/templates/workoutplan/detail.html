<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Workout Plan')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('workoutplans')}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 class="h3 mb-1">
                <span th:text="${workoutPlan.name}"></span>
                <span class="badge fs-6 align-middle"
                      th:classappend="${workoutPlan.active} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${workoutPlan.active} ? 'Active' : 'Inactive'"></span>
            </h1>
            <div class="text-muted">
                <span th:text="${workoutPlan.member.fullName}"></span>
                &middot; <span th:text="${workoutPlan.member.gym.name}"></span>
                &middot; Starts <span th:text="${#temporals.format(workoutPlan.startDate, 'dd/MM/yyyy')}"></span>
            </div>
            <p class="mt-2 mb-0" th:if="${workoutPlan.notes != null}" th:text="${workoutPlan.notes}"></p>
        </div>
        <div class="text-nowrap">
            <a class="btn btn-outline-secondary"
               th:href="@{/workout-plans/{id}/edit(id=${workoutPlan.id})}">Edit Plan</a>
            <a class="btn btn-link" th:href="@{/workout-plans(memberId=${workoutPlan.member.id})}">Back to Plans</a>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Exercises</h2>
        <a class="btn btn-primary"
           th:href="@{/workout-plans/{id}/items/new(id=${workoutPlan.id})}">Add Exercise</a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th style="width: 60px;">#</th>
            <th>Day</th>
            <th>Exercise</th>
            <th>Sets x Reps</th>
            <th>Weight</th>
            <th>Rest</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.orderIndex}"></td>
            <td th:text="${item.dayLabel != null ? item.dayLabel : '-'}"></td>
            <td>
                <div th:text="${item.exercise.name}"></div>
                <div class="small text-muted" th:text="${item.exercise.muscleGroup.label}"></div>
            </td>
            <td class="fw-semibold" th:text="${item.sets + ' x ' + item.reps}"></td>
            <td th:text="${item.weightKg != null ? item.weightKg.stripTrailingZeros().toPlainString() + ' kg' : '-'}"></td>
            <td th:text="${item.restSeconds != null ? item.restSeconds + ' s' : '-'}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/workout-plans/{planId}/items/{itemId}/edit(planId=${workoutPlan.id}, itemId=${item.id})}">Edit</a>
                <form th:action="@{/workout-plans/{planId}/items/{itemId}/delete(planId=${workoutPlan.id}, itemId=${item.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Remove this exercise from the plan?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="7" class="text-center text-muted">No exercises yet. Add the first one.</td>
        </tr>
        </tbody>
    </table>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
