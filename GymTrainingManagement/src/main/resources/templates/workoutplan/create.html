<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Workout Plan')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('workoutplans')}"></nav>

<main class="container" style="max-width: 640px;">
    <h1 class="h3 mb-4">Create Workout Plan</h1>

    <form th:action="@{/workout-plans}" th:object="${workoutPlanForm}" method="post">

        <div class="mb-3">
            <label for="memberId" class="form-label">Member</label>
            <select id="memberId" class="form-select" th:field="*{memberId}" th:errorclass="is-invalid">
                <option value="">Select Member</option>
                <option th:each="member : ${members}"
                        th:value="${member.id}"
                        th:text="${member.fullName + ' (' + member.gym.name + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{memberId}"></div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Plan Name</label>
            <input id="name" type="text" class="form-control" th:field="*{name}"
                   th:errorclass="is-invalid" placeholder="Hypertrophy block 1">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Start Date</label>
                <input id="startDate" type="date" class="form-control" th:field="*{startDate}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{startDate}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="active" class="form-label">Is Active</label>
                <select id="active" class="form-select" th:field="*{active}" th:errorclass="is-invalid">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
                <div class="invalid-feedback" th:errors="*{active}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea id="notes" rows="3" class="form-control" th:field="*{notes}"
                      th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{notes}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save and Add Exercises</button>
        <a class="btn btn-link" th:href="@{/workout-plans}">Back to Plans</a>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
