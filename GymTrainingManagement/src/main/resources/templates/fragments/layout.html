<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Shared layout. Use it in every page like this:

  <head th:replace="~{fragments/layout :: head('Page title')}"></head>
  <body>
  <nav th:replace="~{fragments/layout :: navbar('gyms')}"></nav>
  ...
  <script th:replace="~{fragments/layout :: scripts}"></script>
  </body>

  The value passed to navbar() marks the active menu item (gyms, equipment, logins).
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Gym Training Management'">Gym Training Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/gyms}">Gym Training</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'gyms'} ? 'active'"
                       th:href="@{/gyms}">Gyms</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'equipment'} ? 'active'"
                       th:href="@{/equipment}">Equipment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'gymequipment'} ? 'active'"
                       th:href="@{/gym-equipment}">Gym Equipment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'members'} ? 'active'"
                       th:href="@{/members}">Members</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'exercises'} ? 'active'"
                       th:href="@{/exercises}">Exercises</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'workoutplans'} ? 'active'"
                       th:href="@{/workout-plans}">Workout Plans</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'logins'} ? 'active'"
                       th:href="@{/logins}">Logins</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Messages sent by controllers with redirectAttributes.addFlashAttribute("error" / "success", ...) -->
<div th:fragment="flash">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<script th:fragment="scripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
